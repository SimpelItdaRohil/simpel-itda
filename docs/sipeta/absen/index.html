  var kode = new URLSearchParams(location.search).get('sso');

<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Kegiatan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#082519;--g8:#0b3324;--g7:#0e4a33;--g6:#0f7a48;--g5:#18a160;--g1:#eaf6ef;--gold:#e8b21c;--gold2:#f6d978;--red:#c4372c;--ink:#0f1f18;--mut:#64736b;--line:#e2e8e3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eef2ec;color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
.hero{margin:0 -16px;padding:max(18px,env(safe-area-inset-top)) 20px 74px;color:#fff;border-radius:0 0 40px 40px;position:relative;overflow:hidden;
 background:radial-gradient(380px 250px at 108% -8%,rgba(232,178,28,.55),transparent 62%),radial-gradient(300px 220px at -12% 112%,rgba(24,161,96,.65),transparent 60%),linear-gradient(165deg,#082519,#0b3324 55%,#0e4a33)}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px)}
.hero>*{position:relative}
.br{display:flex;align-items:center;gap:10px}.br img{height:40px;width:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}.br img[src=""],.br img:not([src]){display:none}
.br div{line-height:1.2;font-size:12px;opacity:.9;font-weight:600}.br b{display:block;font-size:14px;letter-spacing:.3px}
.tag{display:inline-block;margin-top:20px;background:var(--gold);color:#3a2a00;font-weight:800;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;border-radius:8px 8px 8px 0;padding:3px 10px}
.hero h1{margin:8px 0 0;font-size:23px;line-height:1.25;letter-spacing:-.4px}
.card{background:#fff;border-radius:26px;padding:20px;box-shadow:0 18px 36px -20px rgba(8,37,25,.55);position:relative}
.info{margin-top:-50px;z-index:2}
.row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eef2ef}.row:last-child{border:0}
.row i{flex:none;width:36px;height:36px;border-radius:12px;background:var(--g1);color:var(--g6);display:grid;place-items:center}
.row svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;color:var(--mut);font-size:11.5px;font-weight:600}.row b{font-size:14.5px}
.ket{margin-top:10px;background:#fffbea;border-radius:14px;padding:11px 13px;font-size:13px;color:#5b4500}
.cnt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13px;color:var(--mut);font-weight:600}.cnt b{color:var(--g6);font-size:18px}
h2{font-size:17px;margin:0 0 14px;color:var(--g8);letter-spacing:-.2px}
.fld{margin-bottom:14px}.fld>label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#2b3a33}.fld>label span{color:var(--red)}
.inp{width:100%;border:1.5px solid var(--line);background:#fbfcfb;border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;outline:none;transition:.15s}
.inp:focus{border-color:var(--g5);background:#fff;box-shadow:0 0 0 4px rgba(24,161,96,.14)}
.lst{margin-top:6px;border:1.5px solid var(--line);border-radius:14px;max-height:230px;overflow:auto;background:#fff}
.lst button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #f0f3f1;padding:11px 14px;font:inherit;cursor:pointer}
.lst button:last-child{border:0}.lst button:active,.lst button:hover{background:var(--g1)}
.lst b{display:block;font-size:14px}.lst small{color:var(--mut);font-size:11.5px}
.lst .em{padding:14px;color:var(--mut);font-size:13px;text-align:center}
.sel{display:flex;align-items:center;gap:12px;background:var(--g1);border:1.5px solid #bfe3cf;border-radius:16px;padding:12px 14px}
.sel i{flex:none;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--g5),var(--g6));color:#fff;display:grid;place-items:center;font-weight:800;font-style:normal}
.sel div{flex:1;min-width:0}.sel b{display:block;font-size:14px;line-height:1.3}.sel small{color:var(--mut);font-size:11.5px}
.sel button{border:0;background:#fff;color:var(--g6);font-weight:700;font-size:12px;border-radius:10px;padding:7px 11px;cursor:pointer}
.pad{position:relative;border:1.5px dashed #9cc9ad;border-radius:16px;background:#fcfffd;overflow:hidden}
.pad canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#a9bdb1;font-size:13px;font-weight:600;pointer-events:none}
.pad button{position:absolute;right:8px;top:8px;border:0;background:#fff;color:var(--red);font-weight:700;font-size:12px;border-radius:10px;padding:6px 11px;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
.btn{width:100%;border:0;border-radius:18px;padding:16px;font:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--g5),var(--g6));box-shadow:0 14px 26px -12px rgba(15,122,72,.8);margin-top:6px}
.btn:disabled{opacity:.6}
.err{background:#fdecea;color:var(--red);border-radius:14px;padding:11px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.big{text-align:center;padding:30px 20px}
.big .ic{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:800}
.ok .ic{background:linear-gradient(135deg,var(--g5),var(--g6));box-shadow:0 0 0 10px rgba(24,161,96,.14);animation:pop .5s}
.cl .ic{background:linear-gradient(135deg,#9aa7a0,#6f7d76)}.bad .ic{background:linear-gradient(135deg,#e0675c,var(--red))}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.big h2{font-size:21px;margin-bottom:6px}.big p{margin:0;color:var(--mut);font-size:14px}
.big .nm{margin:14px 0 4px;font-size:17px;font-weight:800;color:var(--g8)}
.ghost{margin-top:18px;background:var(--g1);color:var(--g6);box-shadow:none}
.foot{text-align:center;color:#8aa095;font-size:11.5px;margin-top:22px}
.skel{height:200px;display:grid;place-items:center;color:var(--mut);font-weight:600}
</style>
</head>

function tampil(){
 var d=INFO;$('#judul').textContent=d.judul;$('#jenisTag').textContent='Absensi '+d.jenis;document.title='Absensi · '+d.judul;
 var jam=d.mulai?d.mulai+(d.selesai?' – '+d.selesai:'')+' WIB':'';
 var h='<div class="card info">'+
  '<div class="row">'+ic('cal')+'<div><small>Hari & Tanggal</small><b>'+e(tglPanjang(d.tgl))+'</b></div></div>'+
  (jam?'<div class="row">'+ic('clock')+'<div><small>Waktu</small><b>'+e(jam)+'</b></div></div>':'')+
  (d.tempat?'<div class="row">'+ic('pin')+'<div><small>Tempat</small><b>'+e(d.tempat)+'</b></div></div>':'')+
  (d.ket?'<div class="ket">'+e(d.ket)+'</div>':'')+
  '<div class="cnt"><b>'+d.hadir+'</b> peserta sudah mengisi</div></div>';
 if(!d.buka){h+='<div class="card big cl" style="margin-top:16px"><div class="ic">🔒</div><h2>Absensi ditutup</h2><p>Pengisian daftar hadir untuk kegiatan ini sudah tidak dibuka.<br>Hubungi penyelenggara bila perlu.</p></div>';$('#app').innerHTML=h;return}
 h+='<div class="card" style="margin-top:16px"><h2>Isi Daftar Hadir</h2><div id="err"></div>';
 if(d.jenis==='Internal')h+='<div class="fld" id="pilih"><label>Nama Anda <span>*</span></label><input class="inp" id="q" placeholder="Ketik nama untuk mencari…" autocomplete="off"><div class="lst" id="lst"></div></div><div id="dipilih"></div>';
 else h+='<div class="fld"><label>Nama Lengkap <span>*</span></label><input class="inp" id="fn" autocomplete="name" placeholder="Nama beserta gelar"></div>'+
  '<div class="fld"><label>Jabatan / Pekerjaan <span>*</span></label><input class="inp" id="fj" placeholder="Contoh: Kepala Bidang"></div>'+
  '<div class="fld"><label>Instansi / Asal <span>*</span></label><input class="inp" id="fi" placeholder="Contoh: Dinas Kominfo Kab. Rokan Hilir"></div>'+
  '<div class="fld"><label>No. HP / WhatsApp</label><input class="inp" id="fh" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx"></div>';
 if(d.ttd)h+='<div class="fld"><label>Tanda Tangan <span>*</span></label><div class="pad"><canvas id="pad"></canvas><div class="ph" id="ph">Tanda tangan di sini</div><button type="button" id="clr">Hapus</button></div></div>';
 h+='<button class="btn" id="kirim">Kirim Kehadiran</button></div>';
 $('#app').innerHTML=h;
 if(d.jenis==='Internal'){CHOSEN=null;$('#q').oninput=daftar;daftar()}
 if(d.ttd)pad();
 $('#kirim').onclick=kirim;
}
function daftar(){
 var q=$('#q').value.toLowerCase().trim(),a=INFO.peg.filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>=0||String(p.j).toLowerCase().indexOf(q)>=0}).slice(0,40);
 $('#lst').innerHTML=a.length?a.map(function(p){return '<button type="button" data-k="'+e(p.k)+'"><b>'+e(p.n)+'</b><small>'+e(p.j)+'</small></button>'}).join(''):'<div class="em">Nama tidak ditemukan</div>';
 $('#lst').onclick=function(ev){var b=ev.target.closest('button');if(!b)return;pilih(b.dataset.k)};
}
function pilih(k){
 var p=INFO.peg.filter(function(x){return x.k===k})[0];if(!p)return;CHOSEN=p;
 $('#pilih').style.display='none';
 $('#dipilih').innerHTML='<div class="sel fld"><i>'+e(p.n.replace(/^(H\.|Hj\.|Ns\.|Dr\.|dr\.)\s*/i,'').charAt(0))+'</i><div><b>'+e(p.n)+'</b><small>'+e(p.j)+'</small></div><button type="button" id="ganti">Ganti</button></div>';
 $('#ganti').onclick=function(){CHOSEN=null;$('#dipilih').innerHTML='';$('#pilih').style.display='';$('#q').value='';daftar();$('#q').focus()};
}
function pad(){
 var cv=$('#pad'),ctx,on=false,has=false,sc=1;
 function fit(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1f6b';has=false;$('#ph').style.display=''}
 function pt(ev){var r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top}}
 cv.addEventListener('pointerdown',function(ev){on=true;cv.setPointerCapture&&cv.setPointerCapture(ev.pointerId);var p=pt(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();has=true;$('#ph').style.display='none';ev.preventDefault()});
 cv.addEventListener('pointermove',function(ev){if(!on)return;var p=pt(ev);ctx.lineTo(p.x,p.y);ctx.stroke();ev.preventDefault()});
 ['pointerup','pointercancel','pointerleave'].forEach(function(n){cv.addEventListener(n,function(){on=false})});
 $('#clr').onclick=fit;
 PAD={ada:function(){return has},data:function(){
  var w=360,h=Math.round(w*cv.height/cv.width),t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(cv,0,0,w,h);
  var u=t.toDataURL('image/png');if(u.length>44000){w=260;h=Math.round(w*cv.height/cv.width);t.width=w;t.height=h;t.getContext('2d').drawImage(cv,0,0,w,h);u=t.toDataURL('image/png')}return u}};
 fit();
}
function gal(m){$('#err').innerHTML='<div class="err">'+e(m)+'</div>';$('#err').scrollIntoView({behavior:'smooth',block:'center'})}
function kirim(){
 var d=INFO,data={};$('#err').innerHTML='';
 if(d.jenis==='Internal'){if(!CHOSEN)return gal('Pilih nama Anda terlebih dahulu.');data.key=CHOSEN.k}
 else{data={nama:$('#fn').value,jabatan:$('#fj').value,instansi:$('#fi').value,hp:$('#fh').value};
  if(data.nama.trim().length<3)return gal('Nama lengkap wajib diisi.');if(!data.jabatan.trim())return gal('Jabatan / pekerjaan wajib diisi.');if(!data.instansi.trim())return gal('Instansi / asal wajib diisi.')}
 if(d.ttd){if(!PAD||!PAD.ada())return gal('Tanda tangan wajib diisi.');data.ttd=PAD.data()}
 var b=$('#kirim');b.disabled=true;b.textContent='Mengirim…';
 call('absKirim',KODE,data).then(function(r){
  tandai(r);tampilSudah(r);window.scrollTo(0,0)
 }).catch(function(m){b.disabled=false;b.textContent='Kirim Kehadiran';gal(m)});
}
load();
})();
</script>
</body>
</html>
